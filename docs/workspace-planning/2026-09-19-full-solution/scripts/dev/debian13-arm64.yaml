# Fresh local development guest. No host-home share and no product installation.
vmType: vz
arch: aarch64
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2
    arch: aarch64
    digest: sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed
cpus: 4
memory: 4GiB
disk: 32GiB
mounts: []
containerd:
  system: false
  user: false
ssh:
  localPort: 60022
  loadDotSSHPubKeys: false
  forwardAgent: false
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      printf '%s\n' 'ssh_deletekeys: false' > /etc/cloud/cloud.cfg.d/99-teslatlas-preserve-ssh-host-keys.cfg
      chmod 0644 /etc/cloud/cloud.cfg.d/99-teslatlas-preserve-ssh-host-keys.cfg
portForwards:
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    guestPortRange: [1, 65535]
    hostPortRange: [1, 65535]
    proto: any
    ignore: true
propagateProxyEnv: false
