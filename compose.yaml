name: teslatlas-hub

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TESLATLAS_HUB_SOURCE_COMMIT: ${TESLATLAS_HUB_SOURCE_COMMIT:?set TESLATLAS_HUB_SOURCE_COMMIT to the exact pushed 40-hex Hub commit}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:?set SOURCE_DATE_EPOCH to the exact pushed Hub commit timestamp}
    image: teslatlas-hub:local
    depends_on:
      volume-init:
        condition: service_completed_successfully
    command: ["--config", "/etc/teslatlas-hub/config.toml", "serve"]
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - hub-data:/var/lib/teslatlas-hub
      - ./config.toml:/etc/teslatlas-hub/config.toml:ro
      - ./tls:/etc/teslatlas-hub/tls:ro
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/teslatlas-hub
        - healthcheck
        - --ca-file
        - /etc/teslatlas-hub/tls/ca.pem
        - --server-name
        - ${TESLATLAS_HUB_TLS_SERVER_NAME:?set TESLATLAS_HUB_TLS_SERVER_NAME to the DNS name in the Hub TLS certificate and public_url}
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  volume-init:
    image: teslatlas-hub:local
    entrypoint: ["/usr/local/libexec/teslatlas-hub-initialize-volume"]
    command: []
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - hub-data:/var/lib/teslatlas-hub
    restart: "no"

volumes:
  hub-data:
    name: teslatlas-hub-data
