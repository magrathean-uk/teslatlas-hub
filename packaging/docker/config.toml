# Candidate template retained for source packaging checks. Compose mounts the
# private repository-root config.toml at runtime; do not put credentials here.
data_dir = "/var/lib/teslatlas-hub"
bind = "0.0.0.0:8443"

[tls]
certificate_path = "/etc/teslatlas-hub/tls/server.pem"
private_key_path = "/etc/teslatlas-hub/tls/server-key.pem"
public_url = "https://hub.example.invalid/"

[geocoder]
enabled = false

[terrain]
enabled = false
