name: CurrentHubRuntimeHost

options:
  bundleIdPrefix: eu.tesatlas.sdk
  deploymentTarget:
    iOS: "17.0"

packages:
  TesatlasSDK:
    path: ..

targets:
  CurrentHubRuntimeHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.tesatlas.sdk.currenthub.runtime-host
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: TesatlasSDK
        product: TesatlasHubSDK
      - package: TesatlasSDK
        product: TesatlasCommands
      - package: TesatlasSDK
        product: TesatlasHubV1Compatibility
      - package: TesatlasSDK
        product: TesatlasCurrentHub

  CurrentHubRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/TesatlasCurrentHubTests
        includes:
          - CurrentHubTestSupport.swift
          - CurrentHubAppleConsumerTests.swift
      - path: ../Tests/TesatlasCurrentHubTests/Fixtures/discovery.json
        buildPhase: resources
      - path: ../Tests/TesatlasCurrentHubTests/Fixtures/claim.json
        buildPhase: resources
      - path: ../Tests/TesatlasCurrentHubTests/Fixtures/health.json
        buildPhase: resources
      - path: ../Tests/TesatlasCurrentHubTests/Fixtures/invitation.json
        buildPhase: resources
      - path: ../Tests/TesatlasCurrentHubTests/Fixtures/ready.json
        buildPhase: resources
      - path: ../Tests/TesatlasCurrentHubTests/Fixtures/vehicles.json
        buildPhase: resources
      - path: ../Tests/TesatlasCurrentHubTests/Fixtures/current.json
        buildPhase: resources
      - path: ../Tests/TesatlasCurrentHubTests/Fixtures/drives.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.tesatlas.sdk.currenthub.runtime-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CurrentHubRuntimeHost.app/CurrentHubRuntimeHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: CurrentHubRuntimeHost
      - package: TesatlasSDK
        product: TesatlasHubSDK
      - package: TesatlasSDK
        product: TesatlasCommands
      - package: TesatlasSDK
        product: TesatlasHubV1Compatibility
      - package: TesatlasSDK
        product: TesatlasCurrentHub

schemes:
  CurrentHubRuntimeHost:
    build:
      targets:
        CurrentHubRuntimeHost: all
        CurrentHubRuntimeTests:
          - test
    test:
      gatherCoverageData: false
      targets:
        - name: CurrentHubRuntimeTests
