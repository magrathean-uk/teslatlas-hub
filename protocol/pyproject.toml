[project]
name = "teslatlas-protocol-conformance"
version = "2026.36.2"
description = "Local validation and conformance tooling for the Teslatlas protocol"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45,<47",
    "zstandard>=0.25,<0.26",
]

[dependency-groups]
dev = [
  "jsonschema[format-nongpl]>=4.26,<5",
  "openapi-spec-validator>=0.7,<1",
]

[tool.uv]
package = false
