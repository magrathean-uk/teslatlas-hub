services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.3
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: host
    environment:
      TZ: Europe/London
    volumes:
      - ./ha-config:/config
      - ./custom_components/teslatlas_hub:/config/custom_components/teslatlas_hub:ro
