[project]
name = "teslatlas-home-assistant"
version = "2026.36.2"
description = "Home Assistant integration for the public Teslatlas Hub protocol"
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.9.4",
    "pytest-homeassistant-custom-component==0.13.367",
    "ruff==0.16.9",
]
# The minimum Home Assistant declared in hacs.json, for the floor test run.
floor = [
    "homeassistant==2026.8.3",
    "pytest-homeassistant-custom-component==0.13.357",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.uv]
package = false
conflicts = [[{ group = "dev" }, { group = "floor" }]]
