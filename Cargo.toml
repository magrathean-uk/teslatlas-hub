[package]
name = "teslatlas-hub"
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
authors = ["Magrathean UK Ltd <contact@magrathean.uk>"]
description = "Self-hosted vehicle telemetry collector and local Teslatlas sync hub"
repository = "https://github.com/magrathean-uk/teslatlas-hub"
homepage = "https://teslatlas.eu"
readme = "README.md"

[lib]
name = "teslatlas_hub"
path = "src/lib.rs"

[[bin]]
name = "teslatlas-hub"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
aes-gcm = "0.11.1"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "=3.0.0"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
http = "1"
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "query", "rustls-no-provider", "stream"] }
rust_decimal = { version = "1.42.1", features = ["db-tokio-postgres"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-time-0_3"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["native-certs", "ring"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "1"
tower-http = { version = "0.7.0", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3.55", features = ["formatting"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", features = ["zstdmt"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = "0.5"
