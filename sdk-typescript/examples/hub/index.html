<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teslatlas Hub browser consumer</title>
  </head>
  <body>
    <main>
      <h1>Teslatlas Hub browser consumer</h1>
      <label>Hub endpoint <input id="endpoint" type="url" autocomplete="url" /></label>
      <label>Expected Hub UUID <input id="hub-id" autocomplete="off" /></label>
      <label>Invitation JSON (optional for an existing in-memory credential)
        <textarea id="invitation" rows="8" autocomplete="off"></textarea>
      </label>
      <p>
        <button id="connect" type="button">Connect / pair</button>
        <button id="refresh" type="button" disabled>Refresh</button>
        <button id="disconnect" type="button" disabled>Disconnect</button>
      </p>
      <pre id="status" role="status">Enter a trusted HTTPS endpoint and expected UUID.</pre>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
